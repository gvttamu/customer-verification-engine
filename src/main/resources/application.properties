spring.application.name=customer-verification-engine
server.port=8090

# Engine state survives restarts in ./data. Delete the folder to start over.
spring.datasource.url=jdbc:h2:file:./data/flowable;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
flowable.database-schema-update=true

# Credentials the Laravel app uses to call the Flowable REST API (/process-api).
engine.username=${FLOWABLE_USERNAME:rest-admin}
engine.password=${FLOWABLE_PASSWORD:test}

# Where the Laravel app runs, and the token from `php artisan api:issue-token "Workflow engine"`.
# Put the real token in config/application.properties (git-ignored) or the LARAVEL_API_TOKEN environment variable.
laravel.base-url=${LARAVEL_BASE_URL:http://127.0.0.1:8000}
laravel.api-token=${LARAVEL_API_TOKEN:}

# The annual interest rate used to estimate the repayment on the loan a customer applies for (0.12 is 12%).
scoring.annual-interest-rate=${SCORING_ANNUAL_INTEREST_RATE:0.12}
